# VigiDoor 智慧安防门配置文件

# 设备信息
device:
  # id 字段已移除，现在由系统根据硬件信息自动生成
  # 生成规则：VIGIDOOR_<hardware_hash>_<system_type>
  # - hardware_hash: 基于CPU序列号/MAC地址/机器ID的MD5哈希
  # - system_type: RPI=树莓派, UBT=Ubuntu/其他Linux
  # 示例：VIGIDOOR_abc123def4567890_RPI
  name: "智慧门_001"
  location: "示例门店"

# MQTT 配置（华为云 IoT）
mqtt:
  broker_host: "bf0f7e134a.st1.iotda-device.cn-north-4.myhuaweicloud.com"
  broker_port: 8883
  username: "697882367f2e6c302f4e7aac_RPI_001"  # 华为云设备接入用户名
  password: "243901f880ad7786739d057529c496b3c233f082466a13d8a8037fd43ca7bef4"  # 华为云设备接入密码
  client_id: "{device_id}"  # 自动使用系统生成的设备ID
  keepalive: 60
  qos: 1
  tls_ca: "./certs/root.pem"  # 华为云根证书路径（root.pem）
  tls_insecure: true  # 仅排查时可设为 true，跳过证书校验


# 摄像头配置（新增）
camera:
  width: 1280
  height: 720
  target_fps: 15  # 目标帧率
  format: "RGB888"  # 像素格式
  shared_memory_name: "vigidoor_frames"  # 共享内存名称

# 流媒体配置
stream:
  zlm_server: "rtsp://192.168.1.119:8554/live" #"rtsp://192.168.1.119:8554/live"  # ZLMediaKit 服务器地址
  stream_key: "{device_id}"  # 推流密钥
  video_codec: "h264"
  audio_codec: "aac"
  bitrate: "1000k"
  fps: 25
  resolution: "1280x720"
  audio_device: "plughw:seeed2micvoicec" # ALSA 音频设备（plughw 支持多路访问，默认启用音频推流）
  audio_bitrate: "128k"      # 音频码率

# 音频配置
audio:
  chunk_size: 1024           # 音频块大小 (samples)
  
  # 音频异常检测配置
  detector:
    model_path: "models/yamnet.tflite"        # YamNet 模型文件路径
    volume_threshold_db: -15.0                 # 音量触发阈值 (分贝)
    debounce_seconds: 2.0                     # 防抖时长 (秒)
    confidence_threshold: 0.4                 # 置信度阈值（0-1）
    enable_dog_bark: false                    # 是否检测狗叫声

# 硬件控制配置
hardware:
  # WS2812B 灯带
  led_strip:
    pin: 10  # GPIO 引脚
    count: 291  # LED 数量
    brightness: 128  # 亮度 (0-255)
    
    # 状态颜色
    colors:
      safe: [0, 255, 0]      # 绿色
      alert: [255, 255, 0]   # 黄色
      alarm: [255, 0, 0]     # 红色

# 日志配置
logging:
  level: "DEBUG"  # DEBUG, INFO, WARNING, ERROR
  max_file_size: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s [%(levelname)s] [%(processName)s] %(message)s"

# 进程管理配置
supervisor:
  # 重启策略
  restart_limit: 5  # 时间窗口内最大重启次数
  restart_window: 300  # 时间窗口（秒）
  
  # 报警自动恢复（秒，0 表示不自动恢复）
  alarm_auto_reset_seconds: 15
  
  # 心跳配置
  heartbeat_interval: 5  # 心跳检查间隔（秒）
  heartbeat_timeout: 30  # 心跳超时（秒）
  
  # 进程启动延迟（秒）
  startup_delays:
    camera: 0                # 摄像头最先启动
    device_controller: 0.5
    mqtt_client: 1.0
    audio_processor: 1.5
    ai_detector: 2.0
    stream_manager: 2.5

# 系统监控配置
monitoring:
  health_report_interval: 60  # 健康上报间隔（秒）
  watchdog_feed_interval: 30  # 看门狗喂狗间隔（秒）
  
  # 资源限制告警
  thresholds:
    cpu_usage: 80  # CPU使用率 %
    memory_usage: 80  # 内存使用率 %
    disk_usage: 90  # 磁盘使用率 %
    temperature: 70  # CPU温度 °C

# 数据存储配置
storage:
  snapshot_dir: "./data/snapshots"  # 告警快照目录
  cache_dir: "./data/cache"  # 临时缓存目录
  max_snapshot_age: 86400  # 快照保留时间（秒，1天）
  max_cache_size: 1073741824  # 最大缓存大小（字节，1GB）

# OSD 配置（新增）
osd:
  # 基础元素开关
  timestamp_enabled: true          # 是否显示时间戳
  device_info_enabled: true        # 是否显示设备信息
  detection_box_enabled: true      # 是否显示检测框


# AI检测器配置示例

ai_detector:
  # 基础配置
  model_path: "models/yolo11n-pose.pt"
  confidence_threshold: 0.5
  target_classes: [0]  # 0=person
  detect_interval: 8  # 默认检测间隔（帧）
  
  # 跳帧策略（根据系统状态动态调整）
  safe_interval: 8     # 安全状态：每8帧检测一次
  alert_interval: 3    # 警戒状态：每3帧检测一次
  alarm_interval: 1    # 报警状态：每帧都检测
  
  # 报警配置
  alarm_cooldown: 5.0  # 报警冷却时间（秒）
  
  # Pipeline配置（串行检测链）
  pipeline:
    # 第1级：运动检测（早停关键）
    - type: motion
      enabled: true
      config:
        min_area: 500              # 最小运动区域面积（像素）
        threshold: 25              # 二值化阈值
        blur_size: 21              # 高斯模糊核大小
        use_background_subtractor: true  # 使用MOG2背景减除
    
    # 第2级：YOLO目标检测
    - type: yolo
      enabled: true
      config:
        model_path: "models/yolo11n-pose.pt"
        confidence_threshold: 0.5
        target_classes: [0]        # 0=person
        input_size: 640
    
    # 第3级：区域入侵检测
    - type: region
      enabled: true
      config:
        overlap_threshold: 0.1     # 重叠阈值（10%）
        regions:
          # 矩形区域示例
          # - name: "门口警戒区"
          #   type: rect
          #   enabled: true
          #   coords: [0.2, 0.7, 0.6, 0.25]  # [x, y, w, h] 归一化坐标
                    # 多边形区域示例
          - name: "楼梯区域"
            type: polygon
            enabled: true
            coords:  # 多边形顶点 [[x1,y1], [x2,y2], ...]
              - [0.2, 0.85]
              - [0.9, 0.9]
              - [0.85, 0.98]
              - [0.1, 0.98]
          
# 使用说明：
# 
# 1. 调整检测频率：
#    - 提高性能：增大 detect_interval
#    - 实时性优先：减小 detect_interval
#
# 2. 运动检测调优：
#    - 减少误报：增大 min_area
#    - 提高灵敏度：减小 min_area 和 threshold
#
# 3. YOLO检测调优：
#    - 减少误报：提高 confidence_threshold
#    - 增加召回率：降低 confidence_threshold
#
# 4. 区域检测：
#    - 归一化坐标范围：[0.0, 1.0]
#    - 原点在左上角
#    - 矩形：[x, y, width, height]
#    - 多边形：顺时针或逆时针定义顶点
#
# 5. Pipeline顺序说明：
#    运动检测 → YOLO检测 → 区域检测
#    前一级返回 should_continue=False 时，后续检测器不执行（早停）
