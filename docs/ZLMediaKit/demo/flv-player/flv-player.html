<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VigiDoor FLV 播放器</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
    <script src="stream_control.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-5xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">VigiDoor FLV 直播播放器</h1>
            <p class="text-sm text-gray-600">仅支持 HTTP-FLV 播放</p>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <div class="flex items-center justify-between flex-wrap gap-3 mb-4">
                <div class="flex items-center gap-2">
                    <span id="statusDot" class="w-3 h-3 rounded-full bg-gray-400"></span>
                    <span id="statusText" class="text-sm font-medium text-gray-600">未连接</span>
                </div>
                <div class="flex gap-2">
                    <button id="btnPlay" class="px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-medium hover:bg-blue-700">开始播放</button>
                    <button id="btnStop" class="px-4 py-2 rounded-md bg-gray-200 text-gray-800 text-sm font-medium hover:bg-gray-300">停止</button>
                </div>
            </div>

            <div class="rounded-lg overflow-hidden bg-black aspect-video">
                <video id="videoPlayer" class="w-full h-full" controls muted autoplay playsinline></video>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-3">播放地址</h2>
            <div class="p-3 bg-gray-50 rounded-lg">
                <p class="text-xs text-gray-500 mb-1">HTTP-FLV</p>
                <p id="flvUrl" class="text-sm font-mono text-gray-700 break-all"></p>
            </div>
        </div>
    </div>

    <script src="flv-player.js"></script>
</body>
</html>
