<html>
  <meta charset="utf-8">
  <head>
    <title>ZLM WebRTC 拉流测试</title>
    <script src="./ZLMRTCClient.js"></script>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
      }

      video {
        width: 70vw;
        max-width: 960px;
        height: calc(70vw * 9 / 16);
        max-height: 540px;
        object-fit: contain;
        background: #333;
      }

      .row {
        margin: 10px 0;
      }

      input[type='text'] {
        width: 70vw;
        max-width: 960px;
      }

      #status {
        color: #555;
      }
    </style>
  </head>

  <body>
    <div class="row">
      <video id="video" controls autoplay playsinline>
        Your browser is too old which doesn't support HTML5 video.
      </video>
    </div>

    <div class="row">
      <label for="streamUrl">WebRTC URL：</label>
      <input id="streamUrl" type="text">
    </div>

    <div class="row">
      <button onclick="start()">开始播放</button>
      <button onclick="stop()">停止播放</button>
    </div>

    <div class="row" id="status">状态：未开始</div>

    <script>
      let player = null;

      const isLocal = document.location.protocol === 'file:';
      const searchParams = new URL(document.location.href).searchParams;
      const app = searchParams.get('app') || 'live';
      const stream = searchParams.get('stream') || 'VIGIDOOR_7c3a41081017190d_RPI';
      const apiPath = `/index/api/webrtc?app=${app}&stream=${stream}&type=play`;
      const apiHost =  'https://192.168.2.139:8443' ;

      document.getElementById('streamUrl').value = apiHost + apiPath;

      function setStatus(msg) {
        document.getElementById('status').textContent = `状态：${msg}`;
      }

      function start() {
        stop();

        const url = document.getElementById('streamUrl').value.trim();
        if (!url) {
          setStatus('URL 不能为空');
          return;
        }

        player = new ZLMRTCClient.Endpoint({
          element: document.getElementById('video'),
          zlmsdpUrl: url,
          recvOnly: true,
          audioEnable: true,
          videoEnable: true,
          debug: true,
        });

        player.on(ZLMRTCClient.Events.WEBRTC_ON_REMOTE_STREAMS, function () {
          setStatus('播放成功');
        });

        player.on(ZLMRTCClient.Events.WEBRTC_ON_CONNECTION_STATE_CHANGE, function (state) {
          setStatus(`连接状态：${state}`);
        });

        player.on(ZLMRTCClient.Events.WEBRTC_ICE_CANDIDATE_ERROR, function () {
          setStatus('ICE 协商失败');
        });

        player.on(ZLMRTCClient.Events.WEBRTC_OFFER_ANWSER_EXCHANGE_FAILED, function (e) {
          setStatus(`SDP 交换失败：${e}`);
          stop();
        });

        setStatus('正在连接...');
      }

      function stop() {
        if (player) {
          player.close();
          player = null;
        }

        const video = document.getElementById('video');
        video.srcObject = null;
        video.load();
        setStatus('已停止');
      }
    </script>
  </body>
</html>
