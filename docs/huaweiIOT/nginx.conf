# 仅当客户端发起 WebSocket 升级时才注入 "upgrade"，否则用 keep-alive
# 这是 nginx 官方推荐的 WebSocket + 普通 HTTP 同路由代理写法
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ''        keep-alive;
}

server {
    listen       443 ssl http2;

    server_name  192.168.1.119;

    access_log   /var/log/nginx/zlm-admin.access.log ;
    error_log    /var/log/nginx/zlm-admin.error.log   warn;

    ssl_certificate     /opt/zlm-admin/certs/192.168.1.119.pem;
    ssl_certificate_key /opt/zlm-admin/certs/192.168.1.119-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;   

    location /admin/ {
        alias /opt/zlm-admin/dist/;           
        
        try_files $uri $uri/ /index.html =404;
   
        index index.html index.htm;
    }

    # 可选：禁止访问隐藏文件（.开头的文件）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }


    location /vigidoor/ {
        proxy_pass http://127.0.0.1:5002;

        # 传递常用 header（强烈建议保留）
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级支持：仅在客户端请求 Upgrade 时才切换为 upgrade，否则为 keep-alive
        proxy_http_version 1.1;
        proxy_set_header Upgrade         $http_upgrade;
        proxy_set_header Connection      $connection_upgrade;

        # 长连接建议设置（可选，但推荐）
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 60s;
    }

    # 可选：提高大文件上传限制（如果你后续有上传功能）
    client_max_body_size  50m;
}


server {
    listen 80;
    server_name 192.168.1.119;
    return 301 https://$host$request_uri;
}