upstream huawei_iot_backend {
    # 负载均衡配置（如果有多个实例）
    server huawei-iot-stream:5002 max_fails=3 fail_timeout=30s;
    # server huawei-iot-stream-2:5002 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name iot-stream.example.com;  # 修改为你的域名

    # 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name iot-stream.example.com;  # 修改为你的域名

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 日志
    access_log /var/log/nginx/iot-stream-access.log;
    error_log /var/log/nginx/iot-stream-error.log;

    # 限流配置
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req zone=api_limit burst=20 nodelay;

    # 客户端上传大小限制
    client_max_body_size 10M;

    # 超时配置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # API 路由
    location /api/ {
        proxy_pass http://huawei_iot_backend;
        proxy_http_version 1.1;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（如需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 缓冲配置
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://huawei_iot_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;  # 不记录健康检查日志
    }

    # 根路径
    location / {
        return 200 '{"status":"ok","service":"huawei-iot-cmd-service"}';
        add_header Content-Type application/json;
    }

    # Nginx 状态页（可选，仅限内网访问）
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
